name: Guest marketplace scene checks
on:
  push:
    branches: [feat/responsive-shoppable-scene-guest-20261016]
  pull_request:
    branches: [feat/mobile-first-market-ux-20261016]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build isolated test market
        run: npm run build:test-worker
      - name: Test guest browsing, hotspots and regressions
        run: npm test
