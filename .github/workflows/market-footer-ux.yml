name: Market test footer and UX checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/test-market-footer-ux-20261016]
permissions:
  contents: read
jobs:
  ui-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build isolated market preview
        run: npm run build
      - name: Verify footer and existing templates
        run: npm test
